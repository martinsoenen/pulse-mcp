name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.3", "8.4", "8.5" ]
        laravel-version: [ "12", "13" ]
        livewire-version: [ "3", "4" ]
        dependencies: [ "lowest", "highest" ]

    name: PHP ${{ matrix.php-version }} - Laravel ${{ matrix.laravel-version }} - Livewire ${{ matrix.livewire-version }} - ${{ matrix.dependencies }} deps

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: --with=illuminate/contracts:^${{ matrix.laravel-version }} --with=livewire/livewire:^${{ matrix.livewire-version }}

      - name: Run test suite
        run: vendor/bin/phpunit
